name: Verifica GPIX iPhone
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepara Flutter e CocoaPods
        shell: bash
        run: bash ci_scripts/ci_post_clone.sh 2>&1 | tee preparazione-ios.log
      - name: Compila GPIX per iPhone
        shell: bash
        run: |
          mkdir -p build
          xcodebuild -workspace GPIX.xcworkspace -scheme GPIX \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-ci -resultBundlePath build/GPIX.xcresult \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee compilazione-ios.log
      - name: Conserva risultato e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-gpix-ios
          path: |
            preparazione-ios.log
            compilazione-ios.log
            build/GPIX.xcresult
