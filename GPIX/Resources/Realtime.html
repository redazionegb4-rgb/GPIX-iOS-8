<!doctype html><html lang="it"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{height:100%;margin:0;background:#000}video{object-fit:cover;background:#17171c}#remote{width:100%;height:100%;border-radius:26px}#local{position:absolute;right:16px;top:16px;width:90px;height:132px;border-radius:18px;border:1px solid #ffffff77}</style><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video><script>
'use strict';
let configuration,stream,clock,stopped=false,polling=false,cursor=0,serial=0,room;
const pending=new Map(),connections=new Map(),buffers=new Map(),offered=new Set();
const status=text=>window.webkit.messageHandlers.gpix.postMessage({event:'status',text});
function request(path,payload){return new Promise((resolve,reject)=>{const id=++serial;const timeout=setTimeout(()=>{pending.delete(id);reject(Error('Connessione scaduta'))},25000);pending.set(id,{resolve,reject,timeout});window.webkit.messageHandlers.gpix.postMessage({requestID:id,path,...(payload?{payload}:{})})})}
function receive(packet){const p=pending.get(packet.id);if(!p)return;clearTimeout(p.timeout);pending.delete(packet.id);packet.error?p.reject(Error(packet.error)):p.resolve(packet.result)}
function action(name,payload={}){return request('/actions',{action:name,payload:{id:configuration.id,...payload}})}
async function connection(key,send){if(connections.has(key))return connections.get(key);const ice=await request('/rtc/config');const pc=new RTCPeerConnection({iceServers:ice.iceServers});connections.set(key,pc);buffers.set(key,[]);if(send&&stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)signal(key,'ice',e.candidate.toJSON()).catch(e=>status(e.message))};pc.ontrack=e=>{document.getElementById('remote').srcObject=e.streams[0];status('Connesso');if(configuration.mode==='call')action('callConnected').catch(()=>{})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')status('Connessione interrotta')};return pc}
function signal(key,kind,data){return action(configuration.mode==='call'?'callSignal':'liveSignal',{kind,data,...(configuration.mode==='live'?{viewer:key}:{})})}
async function offer(key){if(offered.has(key))return;const pc=await connection(key,true),sdp=await pc.createOffer();await pc.setLocalDescription(sdp);await signal(key,'offer',{type:sdp.type,sdp:sdp.sdp});offered.add(key)}
async function consume(s,key){const pc=await connection(key,configuration.mode==='call'||room.host===configuration.me);if(s.kind==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(s.data);else buffers.get(key).push(s.data);return}await pc.setRemoteDescription(s.data);for(const candidate of buffers.get(key))await pc.addIceCandidate(candidate);buffers.set(key,[]);if(s.kind==='offer'){const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await signal(key,'answer',{type:answer.type,sdp:answer.sdp})}}
async function update(){if(stopped||polling)return;polling=true;try{const live=configuration.mode==='live';const result=await request((live?'/live/room/':'/rtc/call/')+configuration.id+'?after='+cursor);room=live?result.room:result.call;if(['ended','declined','missed'].includes(room.status)){stop();status('Terminata');return}if(!stream&&(!live||room.host===configuration.me)){stream=await navigator.mediaDevices.getUserMedia({audio:true,video:live||!!room.video});document.getElementById('local').srcObject=stream}if(live&&room.host===configuration.me){for(const id of result.viewers)await offer(id);for(const [id,pc]of connections)if(!result.viewers.includes(id)){pc.close();connections.delete(id);offered.delete(id)}}else if(!live&&room.caller===configuration.me)await offer('call');for(const s of result.signals){await consume(s,live?s.viewer:'call');cursor=Math.max(cursor,s.seq)}status(live?'Spettatori: '+result.viewers.length:room.status==='ringing'?'Chiamata in corso…':room.status==='connected'?'Connesso':'Connessione…');await action(live?'liveHeartbeat':'callHeartbeat')}catch(e){status(e.message)}finally{polling=false}}
function start(value){configuration=value;stopped=false;update();clock=setInterval(update,1500)}
function toggleAudio(){stream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled)}
function toggleVideo(){stream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled)}
function stop(){stopped=true;clearInterval(clock);stream?.getTracks().forEach(t=>t.stop());for(const pc of connections.values())pc.close();connections.clear();for(const p of pending.values()){clearTimeout(p.timeout);p.reject(Error('Chiamata terminata'))}pending.clear();document.getElementById('remote').srcObject=null;document.getElementById('local').srcObject=null;stream=null}
window.addEventListener('pagehide',stop);
</script></html>
