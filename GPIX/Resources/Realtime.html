<!doctype html><html lang="it"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
body{margin:0;background:#101015;color:white;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{min-height:90vh;display:flex;flex-direction:column;padding:16px;gap:15px}video{width:100%;max-height:60vh;background:#1e1e29;border-radius:22px;object-fit:cover}#local{position:absolute;right:25px;top:22px;width:100px;height:145px;border:1px solid #ffffff66}h2{font-size:22px}button{border:0;border-radius:28px;padding:14px 20px;background:#4c52ff;color:white;font-weight:600;font-size:15px}button.danger{background:#d92d50}.controls{display:flex;justify-content:center;gap:10px}#comments{font-size:13px;color:#ddd;max-height:150px;overflow:auto}input{border:0;border-radius:20px;padding:12px;background:#ffffff15;color:white;min-width:0;flex:1}.row{display:flex;gap:9px}#status{color:#c0c0d0}#error{color:#ff879b}#accept{display:none}</style>
<main><video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video><h2 id="title">Connessione GPIX</h2><div id="status">Preparazione…</div><div id="error"></div><button id="accept">Rispondi</button><button id="start">Attiva microfono / fotocamera</button><div class="controls"><button id="mute">Microfono</button><button id="camera">Video</button><button id="end" class="danger">Termina</button></div><div id="comments"></div><div class="row" id="commentRow"><input id="comment" placeholder="Aggiungi un commento…"><button id="sendComment">Invia</button><button id="like">♥</button></div></main>
<script>
'use strict';
let config,seq=0,count=0,requests=new Map(),pcs=new Map(),stream=null,timer=null,stopped=false,working=false,room=null,offered=new Set(),iceBuffers=new Map();
const $=id=>document.getElementById(id);
function api(path,payload){return new Promise((resolve,reject)=>{const requestID=++count;requests.set(requestID,{resolve,reject});window.webkit.messageHandlers.gpix.postMessage({requestID,path,...(payload?{payload}:{})});setTimeout(()=>{const p=requests.get(requestID);if(p){requests.delete(requestID);p.reject(Error('Connessione scaduta'))}},20000)})}
function nativeResult(id,result,error){const p=requests.get(id);if(!p)return;requests.delete(id);error?p.reject(Error(error)):p.resolve(result)}
const action=(a,p={})=>api('/actions',{action:a,payload:{id:config.id,...p}});
function fail(e){$('error').textContent=e.message||String(e)}
async function media(video){if(stream)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false});$('local').srcObject=stream;return stream}
async function signal(peer,kind,data){return action(config.mode==='call'?'callSignal':'liveSignal',{...(config.mode==='live'?{viewer:peer}:{}),kind,data})}
async function peer(id,send){if(pcs.has(id))return pcs.get(id);const ice=await api('/rtc/config');const pc=new RTCPeerConnection({iceServers:ice.iceServers});pcs.set(id,pc);iceBuffers.set(id,[]);if(send&&stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)signal(id,'ice',e.candidate.toJSON()).catch(fail)};pc.ontrack=e=>{$('remote').srcObject=e.streams[0];$('status').textContent='Connesso';$('remote').play().catch(()=>{});if(config.mode==='call')action('callConnected').catch(fail)};pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.connectionState))$('status').textContent='Connessione interrotta, verificare la rete'};return pc}
async function handle(s,pc,key){if(s.kind==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(s.data);else iceBuffers.get(key).push(s.data);return}await pc.setRemoteDescription(s.data);for(const c of iceBuffers.get(key)||[])await pc.addIceCandidate(c);iceBuffers.set(key,[]);if(s.kind==='offer'){const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await signal(key,'answer',{type:answer.type,sdp:answer.sdp})}}
async function update(){if(stopped||working)return;working=true;try{const live=config.mode==='live';const result=await api((live?'/live/room/':'/rtc/call/')+config.id+'?after='+seq);room=live?result.room:result.call;const status=room.status;$('status').textContent=live?'Spettatori: '+result.viewers.length:status==='ringing'?'Chiamata in corso…':status==='accepted'?'Connessione…':status;if(['ended','declined','missed'].includes(status)){stopMedia();$('status').textContent='Terminata';return}if(!live&&room.callee===config.me&&status==='ringing')$('accept').style.display='block';
if(live&&room.host===config.me&&stream){for(const id of result.viewers){if(!offered.has(id)){const pc=await peer(id,true);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await signal(id,'offer',{type:offer.type,sdp:offer.sdp});offered.add(id)}}for(const [id,pc]of pcs)if(!result.viewers.includes(id)){pc.close();pcs.delete(id);offered.delete(id)}}
if(!live&&stream&&room.caller===config.me&&!offered.has('call')){const pc=await peer('call',true);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await signal('call','offer',{type:offer.type,sdp:offer.sdp});offered.add('call')}
if(!live&&stream)await peer('call',true);for(const s of result.signals){const key=live?s.viewer:'call';if(!live&&!stream)break;if(live&&room.host!==config.me){const pc=await peer(key,false);await handle(s,pc,key)}else{const pc=pcs.get(key);if(!pc)break;await handle(s,pc,key)}seq=Math.max(seq,s.seq)}
if(live){$('comments').replaceChildren();for(const c of (result.comments||[]).slice().reverse()){const line=document.createElement('div');line.textContent=c.text;$('comments').appendChild(line)}}
await action(live?'liveHeartbeat':'callHeartbeat');}catch(e){fail(e)}finally{working=false}}
function initialize(value){config=value;$('title').textContent=value.mode==='live'?'Diretta GPIX':'Chiamata GPIX';$('commentRow').style.display=value.mode==='live'?'flex':'none';$('start').onclick=async()=>{try{if(config.mode==='live'){await update();if(room.host===config.me)await media(true);else $('start').style.display='none'}else{await update();await media(!!room.video)}$('start').style.display='none';await update()}catch(e){fail(e)}};$('accept').onclick=async()=>{try{await media(!!room.video);await action('callAccept');$('accept').style.display='none';$('start').style.display='none';await update()}catch(e){fail(e)}};$('mute').onclick=()=>{stream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled)};$('camera').onclick=()=>{stream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled)};$('end').onclick=async()=>{try{await action(config.mode==='call'?'callEnd':room.host===config.me?'liveEnd':'liveLeave')}finally{stopMedia();$('status').textContent='Terminata'}};$('sendComment').onclick=async()=>{const text=$('comment').value.trim();if(!text)return;try{await action('liveComment',{text});$('comment').value='';await update()}catch(e){fail(e)}};$('like').onclick=()=>action('liveLike').catch(fail);update();timer=setInterval(update,1500)}
function stopMedia(){stopped=true;if(timer)clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());pcs.forEach(pc=>pc.close());pcs.clear();stream=null;$('remote').srcObject=null;$('local').srcObject=null}
window.addEventListener('pagehide',stopMedia);
</script></html>
