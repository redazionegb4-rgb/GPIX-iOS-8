name: gpix
description: GPIX social beta per la community LGBTQ+.
publish_to: none
version: 2.24.0+77
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  font_awesome_flutter: 10.9.1
  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  image: ^4.5.4
