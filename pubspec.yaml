  image_picker: ^1.2.0
  media_kit: ^1.2.6
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  record: ^6.1.1
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
dev_dependencies:
